categories:
  enchantment:
    name: "<!i><#FFD700>附魔相关</#FFD700>"
    icon: enchantment:ashes_o_enchantment
    list:
      - "#enchantment:originbooks"
      - "#enchantment:props"
      - "#enchantment:brokengears"
      - "#enchantment:enchantedbook"
      - "#enchantment:ui"
  enchantment:props:
    name: "<!i><#FFD700>道具</#FFD700>"
    icon: enchantment:ashes_o_enchantment
    hidden: true
    list:
      - enchantment:rune_power_30
      - enchantment:rune_power_50
      - enchantment:rune_power_75
      - enchantment:rune_power_100
      - enchantment:rune_protection
      - enchantment:rune_slot
      - enchantment:ashes_o_enchantment
      - enchantment:tome_of_renewal
      - enchantment:tome_of_reversal
      - enchantment:repair_material_50p
      - enchantment:repair_material_600s
      - enchantment:random_enchanted_book


##
## 模板
##
templates#models#item:
  # 模型 - 简单2D物品模型(自动生成)
  enchantment:special/prop:
    item-model: "${path}"
    model:
      type: "minecraft:model"
      path: "${path}"
      generation:
        parent: "minecraft:item/generated"
        textures:
          "layer0": "${path}"


##
## 物品
##
items#misc#materials:
  enchantment:rune_power_30:
    material: paper
    item-model: "minecraft:firenchant/props/${__ID__}"
    model:
      type: "minecraft:model"
      path: "minecraft:firenchant/props/${__ID__}"
      generation:
        parent: "minecraft:item/generated"
        textures:
          "layer0": "minecraft:firenchant/props/rune_power"
    data:
      item-name: "<!i><yellow>升级符文（30%）"
      lore:
        - "<!i><#a7a7a7>成功率: <red>30%"
        - "<!i><#a3aab6>可以在铁砧中使用，将会随机给物品"
        - "<!i><#a3aab6>上的一个可升级魔咒进行升级。"
      components:
        minecraft:custom_data:
          FirEnchant::PowerChance: 30
