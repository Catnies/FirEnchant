##
## 模板
##
templates#enchantment#brokengears:
  # 配置模板 - 破损的装备
  custom:special/enchantment/brokengears:
    material: paper
    item-model: "minecraft:firenchant/brokengears/${__ID__}"
    model:
      type: "minecraft:model"
      path: "minecraft:firenchant/brokengears/${__ID__}"
      generation:
        parent: "minecraft:item/generated"
        textures:
          "layer0": "minecraft:firenchant/brokengears/${__ID__}"


